<!DOCTYPE html>
<html><body style="font-family:system-ui;padding:20px;max-width:400px;margin:auto">
  <style>
    h2 { color: #1a56db; }
    .add-row { display:flex; gap:8px; margin-bottom:14px; }
    input { flex:1; padding:8px 12px; border:2px solid #c8d4f0; border-radius:8px; font-size:15px; }
    button { padding:8px 16px; border:none; border-radius:8px; cursor:pointer; font-size:15px; font-weight:bold; }
    .add-btn { background:#1a56db; color:white; }
    #todo-list { list-style:none; padding:0; }
    .todo-item { display:flex; align-items:center; justify-content:space-between;
      padding:10px 14px; margin-bottom:6px; background:#f0f4ff;
      border-radius:8px; border:1px solid #c8d4f0; }
    .del-btn { background:#dc2626; color:white; padding:4px 10px; font-size:12px; border-radius:6px; }
    #empty-msg { color:#9ca3af; text-align:center; padding:20px; display:none; }
  </style>

  <h2>My To-Do List</h2>
  <div class="add-row">
    <input id="todo-input" type="text" placeholder="Add a task...">
    <button id="add-btn" class="add-btn">+ Add</button>
  </div>
  <ul id="todo-list"></ul>
  <p id="empty-msg">No tasks yet! Add one above.</p>

  <script>
    // YOUR CODE HERE
    // 1. Select input, add-btn, todo-list, empty-msg
    const input = document.querySelector('#todo-input')
    const add_btn = document.querySelector('#add-btn')
    const todo_list = document.querySelector('#todo-list')
    const empty_msg = document.querySelector('#empty-msg')

    // 2. Write function addTask() that:
    //    a. Reads input.value (trim it, skip if empty)
    //    b. Creates an <li> with the text and a delete button
    //    c. Appends to the list
    //    d. Clears the input
    function addTask(){
        const taskText = input.value.trim()
        if (taskText == false){
            return
        }

        const li = document.createElement('li')
        li.textContent = taskText
        const del = document.createElement('button')
        del.textContent = 'Delete'
        del.classList.add('del-btn')
        li.appendChild(del)
        li.classList.add('todo-item')
        todo_list.appendChild(li)
        input.value = ''
    }
    // 3. Add 'click' listener to add-btn → call addTask()
    add_btn.addEventListener('click', () => {
        addTask()
    })
    // 4. Add 'keydown' listener to input → if e.key === 'Enter', call addTask()
    input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter'){
            addTask()
        }
    } )
    // 5. Add 'click' event delegation on todo-list → if .del-btn clicked, remove li
    todo_list.addEventListener('click', (e) => {
        if (e.target.matches('.del-btn')){
            e.target.closest('li').remove();
            console.log('clicked')
        }
    })
    // BONUS: Show/hide #empty-msg based on list length
  </script>
</body></html>
