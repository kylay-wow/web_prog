<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* ── The classic CSS reset using * ── */
        *, *::before, *::after {
        box-sizing: border-box; /* padding/border included in width — very useful */
        margin: 0;
        padding: 0;
        }

        /* Now you add styles on top cleanly */
        body {
        font-family: 'Inter', sans-serif;
        line-height: 1.6;
        background: #f8fafc;
        color: #1e293b;
        }

        /* Avoid this — affects every element */
        /* * { color: blue; } ← too aggressive! */
    </style>
</head>
<body>
    
</body>
</html>
