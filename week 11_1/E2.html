
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Card Component</title>
    <style>
        
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        padding: 40px 20px;
        font-family: 'Segoe UI', sans-serif;
        background: #15171c;
        color: #f1f1f1;
    }

    /* Notification container */
    .notif-list {
        max-width: 600px;
        margin: 30px auto;
        display: flex;
        flex-direction: column;
        gap: 14px;
    }

    /* Individual notification */
    .notification {
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 18px 20px;
        background: #20232b;
        border: 1px solid #343944;
        border-left: 4px solid #8999a6;
        border-radius: 10px;
        transition: transform 0.2s ease, background 0.2s ease;
    }

    .notification:hover {
        transform: translateX(5px);
        background: #282c36;
    }

    /* Icon */
    .notification-icon {
        width: 38px;
        height: 38px;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 50%;
        font-size: 20px;
        font-weight: bold;
    }

    /* Notification text */
    .notification-content strong {
        font-size: 11px;
        letter-spacing: 1.5px;
    }

    .notification-content p {
        margin: 5px 0 0;
        font-size: 14px;
        color: #b8bec9;
    }

    /* Success styling */
    .notification.success {
        border-left-color: #35c98b;
    }

    .success .notification-icon {
        background: rgba(53, 201, 139, 0.15);
        color: #35c98b;
    }

    .success strong {
        color: #35c98b;
    }

    /* Warning styling */
    .notification.warning {
        border-left-color: #f0b84b;
    }

    .warning .notification-icon {
        background: rgba(240, 184, 75, 0.15);
        color: #f0b84b;
    }

    .warning strong {
        color: #f0b84b;
    }

    /* Default styling */
    .notification.default {
        border-left-color: #8999a6;
    }

    .default .notification-icon {
        background: rgba(137, 153, 166, 0.15);
        color: #8999a6;
    }

    .default strong {
        color: #8999a6;
    }

    </style>
</head>
<body>
    <div id="root"></div>

    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>

    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel">
        
    function NotifItem({ type, message }) {
        let icon;
        let statusClass;

        if (type === "success") {
            icon = "✓";
            statusClass = "success";
        } else if (type === "warning") {
            icon = "⚠";
            statusClass = "warning";
        } else {
            icon = "●";
            statusClass = "default";
        }

        return (
            <div className={`notification ${statusClass}`}>
                <span className="notification-icon">{icon}</span>

                <div className="notification-content">
                    <strong>{type.toUpperCase()}</strong>
                    <p>{message}</p>
                </div>
            </div>
        );
    }

        const notifications = [
            { id: 1, type: "success", message: "Profile updated!" },
            { id: 2, type: "warning", message: "Password expires soon." },
            { id: 3, type: "info", message: "Welcome back!" }
        ];

        function NotifList() {
            return (
                <div className="notif-list">
                    {notifications.map((notification) => (
                        <NotifItem
                            key={notification.id}
                            type={notification.type}
                            message={notification.message}
                        />
                    ))}
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById("root")).render(<NotifList/>)
    </script>
</body>
</html>
