<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
  <!-- BLOCK elements — each starts a new line -->
  <h2>Heading (block)</h2>
  <p>Paragraph (block)</p>
  <div>Div (block)</div>

  <!-- INLINE elements — flow on one line -->
  <p>
    This paragraph contains
    <strong>bold (inline)</strong>,
    <em>italic (inline)</em>,
    <a href="#">a link (inline)</a>, and
    <span style="color:teal">coloured text (inline)</span>
    — all on the same line.
  </p>

  <p><strong>Good</strong> — span inside p</p>

</body>
</html>
