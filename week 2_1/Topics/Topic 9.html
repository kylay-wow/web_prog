<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
  <p>This is the first paragraph.
     Extra spaces    and line breaks
     in the source are all collapsed to one space.</p>

  <p>This is the second paragraph — the browser adds
     margin between paragraphs automatically.</p>

  <p>Inline elements are fine inside a paragraph:
     <strong>bold text</strong>, <em>italic text</em>,
     and <a href="#">links</a> all work here.</p>
</body>
</html>
