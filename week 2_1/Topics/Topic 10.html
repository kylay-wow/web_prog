<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
  <!-- Inline elements flow on the same line -->
  <p>
    Normal text,
    <strong>bold text</strong>,
    <em>italic text</em>,
    <a href="#">a link</a>,
    and <span class="highlight">highlighted text</span>
    all sit on ONE line.
  </p>

  <!-- span is invisible by default — CSS gives it style -->
  <style>
    .highlight { background: yellow; color: black; padding: 2px 4px; }
  </style>
</body>
</html>
