<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
  <!-- Local file — relative path -->
  <img src="photo.jpg" alt="Profile photo" width="300" height="300">

  <!-- File in a subdirectory -->
  <img src="images/banner.png" alt="Course banner" width="800" height="200">

  <!-- Image from the internet (absolute URL) -->
  <img src="https://picsum.photos/400/300" alt="Random placeholder" width="400" height="300">

  <!-- figure + figcaption for labelled images -->
  <figure>
    <img src="diagram.png" alt="Block vs Inline diagram" width="600">
    <figcaption>Figure 1: Block vs Inline element layout</figcaption>
  </figure>
</body>
</html>
