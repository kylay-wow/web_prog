<!DOCTYPE html>
<html><body style="font-family:system-ui;padding:24px;max-width:500px;margin:auto">
  <h2>Image Format Practice</h2>

  <!-- TASK: Replace this simple <img> with a proper <picture> element -->
  <!-- Use: WebP source + JPEG fallback + srcset + alt + width + height -->

  <picture>
    <source srcset="https://picsum.photos/800 800w, https://picsum.photos/400 400w" type="image/webp">
    <img
        src="https://picsum.photos/800"
        srcset="https://picsum.photos/400 400w, https://picsum.photos/800 800w"
        sizes="(max-width: 480px) 400px, 800px"
        alt="Descriptive text"
        width="800" height="400"
    >
  </picture>


  <p style="margin-top:12px;font-size:13px;color:#666">
    Open Network tab, reload, and check the image size. With real WebP files,
    you'd see 25-34% smaller file sizes vs JPEG.
  </p>
</body></html>
