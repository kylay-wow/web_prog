
<!DOCTYPE html>
<html>
<head>
    <title>Week 11.2 React Activities</title>

    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            margin: 30px;
            color: #333;
        }

        h1 {
            text-align: center;
        }

        .activity {
            background: white;
            padding: 20px;
            margin: 20px auto;
            max-width: 700px;
            border: 1px solid #ddd;
            border-radius: 8px;
        }

        button {
            padding: 7px 12px;
            margin: 5px;
            cursor: pointer;
        }

        input, textarea {
            padding: 8px;
            margin: 5px;
        }

        li {
            margin: 8px 0;
        }

        nav {
            text-align: center;
            margin: 20px;
        }

        nav a {
            margin: 5px;
            color: blue;
        }
    </style>
</head>

<body>

    <h1>Week 11.2 - React Activities E6</h1>
    <p style="text-align:center;">React Props, State and Events</p>

    <div id="root"></div>

    <script type="text/babel">

        const { useState, useEffect } = React;

        function App() {

            // E6: Assignment Tracker
            const [tasks, setTasks] = useState([
                { id: 1, title: 'Complete React notes', completed: false },
                { id: 2, title: 'Practise useState', completed: true },
                { id: 3, title: 'Finish coding exercise', completed: false }
            ]);

            const [filter, setFilter] = useState('all');

            function toggleTask(id) {
                setTasks(tasks.map(task =>
                    task.id === id
                        ? { ...task, completed: !task.completed }
                        : task
                ));
            }

            function clearCompleted() {
                setTasks(tasks.filter(task => !task.completed));
            }

            const filteredTasks = tasks.filter(task => {
                if (filter === 'pending') return !task.completed;
                if (filter === 'completed') return task.completed;
                return true;
            });

            return (
                <div>

                    <section className="activity" id="e6">
                        <h2>E6: Assignment Tracker</h2>

                        <button onClick={() => setFilter('all')}>All</button>
                        <button onClick={() => setFilter('pending')}>Pending</button>
                        <button onClick={() => setFilter('completed')}>Completed</button>

                        <ul>
                            {filteredTasks.map(task => (
                                <li key={task.id}>
                                    <label>
                                        <input
                                            type="checkbox"
                                            checked={task.completed}
                                            onChange={() => toggleTask(task.id)}
                                        />
                                        {task.title}
                                    </label>
                                </li>
                            ))}
                        </ul>

                        {filteredTasks.length === 0 && (
                            <p>No assignments found.</p>
                        )}

                        <button onClick={clearCompleted}>
                            Clear Completed Tasks
                        </button>
                    </section>

                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);

    </script>

</body>
</html>
