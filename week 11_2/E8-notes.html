
<!DOCTYPE html>
<html>
<head>
    <title>Week 11.2 React Activities</title>

    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            margin: 30px;
            color: #333;
        }

        h1 {
            text-align: center;
        }

        .activity {
            background: white;
            padding: 20px;
            margin: 20px auto;
            max-width: 700px;
            border: 1px solid #ddd;
            border-radius: 8px;
        }

        button {
            padding: 7px 12px;
            margin: 5px;
            cursor: pointer;
        }

        input, textarea {
            padding: 8px;
            margin: 5px;
        }

        li {
            margin: 8px 0;
        }

        nav {
            text-align: center;
            margin: 20px;
        }

        nav a {
            margin: 5px;
            color: blue;
        }
    </style>
</head>

<body>

    <h1>Week 11.2 - React Activities E8</h1>
    <p style="text-align:center;">React Props, State and Events</p>

    <div id="root"></div>

    <script type="text/babel">

        const { useState, useEffect } = React;

        function App() {

            // E8: Personal Note Saver
            const [note, setNote] = useState(() => {
                return localStorage.getItem('myNote') || '';
            });

            useEffect(() => {
                localStorage.setItem('myNote', note);
            }, [note]);

            return (
                <div>

                    <section className="activity" id="e8">
                        <h2>E8: Personal Note Saver</h2>

                        <textarea
                            rows="5"
                            cols="40"
                            value={note}
                            onChange={(e) => setNote(e.target.value)}
                            placeholder="Write a note here..."
                        />

                        <br />

                        <button onClick={() => setNote('')}>
                            Clear Note
                        </button>

                        <p>
                            {note ? 'Your note is saved!' : 'No note available.'}
                        </p>
                    </section>

                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);

    </script>

</body>
</html>
