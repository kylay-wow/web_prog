<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=\, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- novalidate = JS handles ALL validation -->
    <form id="reg-form" novalidate>

        <label for="email">Email</label>

        <input
            type="email"
            id="email"
            required
            aria-describedby="email-err"
            aria-invalid="false"
        >
        
        <label for="studid">Student ID</label>

        <input type="text"
            id="studid"
            required
            aria-describedby="stud-err"
            aria-invalid="false"
        >

        <span id="email-err" role="alert"></span>
        <span id="stud-err" role="alert"></span>

        <button type="submit">Register</button>

    </form>
        
    <script>
        const studentIdPattern = /^\d{9}$/;

        function validateStudentId(input) {
            const err = document.getElementById('id-err');

            if (!studentIdPattern.test(input.value)) {
                err.textContent = 'Student ID must be exactly 9 digits.';
                input.setAttribute('aria-invalid', 'true');
            } else {
                err.textContent = '';
                input.setAttribute('aria-invalid', 'false');
            }
        }
        
        function validateEmail(input) {
            const err = document.getElementById('email-err');

            if (input.validity.valueMissing) {
                err.textContent = 'Email is required.';
                input.setAttribute('aria-invalid', 'true');

            } else if (input.validity.typeMismatch) {
                err.textContent = 'Please enter a valid email address.';
                input.setAttribute('aria-invalid', 'true');

            } else {
                err.textContent = '';
                input.setAttribute('aria-invalid', 'false');
            }
        }
        // Real-time validation
        email.addEventListener('input', function() {
            validateEmail(this);
        });

        document.getElementById('studid').addEventListener('input', function(){
            validateStudentId(this);
        });

        // Final validation before submission
        form.addEventListener('submit', function(e) {
            e.preventDefault();

            if (validateAll()) {
                submitForm();
            }
        });
    </script>
</body>
</html>
