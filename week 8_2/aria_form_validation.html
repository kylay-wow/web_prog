<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=\, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- novalidate = JS handles ALL validation -->
    <form id="reg-form" novalidate>

    <div class="field-group">
        <label for="email">Email</label>

    <input
        id="email"
        type="email"
        aria-describedby="email-err"
        aria-invalid="false"
    >
        <!-- role="alert" → screen readers announce text changes -->
    <span
        id="email-err"
        class="error-msg"
        role="alert"
        aria-live="polite"
    ></span>
    </div>

    <button type="submit">Register</button>
    </form>
        
    <script>
        function validateEmail(input) {
            const err = document.getElementById('email-err');

            if (input.validity.valueMissing) {
                err.textContent = 'Email is required.';
                input.setAttribute('aria-invalid', 'true');
            } else if (input.validity.typeMismatch) {
                err.textContent = 'Please enter a valid email address.';
                input.setAttribute('aria-invalid', 'true');
            } else {
                err.textContent = '';
                input.setAttribute('aria-invalid', 'false');
            }
        }

        // JS: update both attributes on every validation
        function setError(input, errId, msg) {
            document.getElementById(errId).textContent = msg;
            input.setAttribute('aria-invalid', msg ? 'true' : 'false');
            input.classList.toggle('valid-err', !!msg);
            input.classList.toggle('valid-ok', !msg);
        }
        // ── Pattern 1: validate-on-submit ──
        document.getElementById('reg-form')
        .addEventListener('submit', function(e) {
            e.preventDefault();         // stop reload
            const ok = validateAll();
            if (ok) submitForm();        // only send if valid
        });

        // ── Pattern 2: validate-on-input (real-time) ──
        document.getElementById('email')
        .addEventListener('input', function() {
            validateEmail(this);         // runs every keystroke
        });

        // ── Usually combine both ──
        // input → real-time feedback while typing
        // submit → final guard before sending
        
    </script>
</body>
</html>
