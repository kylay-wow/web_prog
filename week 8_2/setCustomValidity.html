<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=\, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- novalidate = JS handles ALL validation -->
    <form id="reg-form" novalidate>

    <div class="field-group">
        <label for="email">Email</label>

    <input
        id="email"
        type="email"
        required
        aria-describedby="email-err"
        aria-invalid="false"
    />
    <span id="email-err" role="alert" aria-live="polite"></span>

    <div class="field-group">
        <label for="password">Password</label>
        <input
            type="password"
            id="password"
            required
            aria-describedby="password-err"
            aria-invalid="false"
        />
        <span id="password-err" role="alert" aria-live="polite"></span>
    </div>

    <div class="field-group">
        <label for="confirm">Confirm Password</label>
        <input
            type="password"
            id="confirm"
            required
            aria-describedby="confirm-err"
            aria-invalid="false"
        />
        <span id="confirm-err" role="alert" aria-live="polite"></span>
    </div>

        <!-- role="alert" → screen readers announce text changes -->

    <button type="submit">Register</button>
    </form>
        
    <script>
        function validateEmail(input) {
            const err = document.getElementById('email-err');

            if (input.validity.valueMissing) {
                err.textContent = 'Email is required.';
                input.setAttribute('aria-invalid', 'true');
                return false;
            } else if (input.validity.typeMismatch) {
                err.textContent = 'Please enter a valid email address.';
                input.setAttribute('aria-invalid', 'true');
                return false;
            } else {
                err.textContent = '';
                input.setAttribute('aria-invalid', 'false');
                return true;
            }
        }

        function validateAll() {
            const email = document.getElementById('email');
            return validateEmail(email);
        }

        function submitForm() {
            alert('Registration successful!');
        }

        // JS: update both attributes on every validation
        function setError(input, errId, msg) {
            document.getElementById(errId).textContent = msg;
            input.setAttribute('aria-invalid', msg ? 'true' : 'false');
            input.classList.toggle('valid-err', !!msg);
            input.classList.toggle('valid-ok', !msg);
        }
        // ── Pattern 1: validate-on-submit ──
        document.getElementById('reg-form')
        .addEventListener('submit', function(e) {
            e.preventDefault();         // stop reload
            const ok = validateAll();
            if (ok) submitForm();        // only send if valid
        });

        // ── Pattern 2: validate-on-input (real-time) ──
        document.getElementById('email')
        .addEventListener('input', function() {
            validateEmail(this);         // runs every keystroke
        });

        // ── Usually combine both ──
        // input → real-time feedback while typing
        // submit → final guard before sending

        const pw = document.getElementById('password');
        const pw2 = document.getElementById('confirm');
        const err2 = document.getElementById('confirm-err');

        function checkConfirm(){
            if (pw2.value === ''){
                pw2.setCustomValidity('');
                err2.textContent = '';
                pw2.setAttribute('aria-invalid', 'false');
            }else if (pw2.value !== pw.value){
                pw2.setCustomValidity('Passwords do not match');
                err2.textContent = 'Passwords do not match';
                pw2.setAttribute('aria-invalid', 'true');
            }else{
                pw2.setCustomValidity('');
                err2.textContent = 'Passwords match';
                pw2.setAttribute('aria-invalid', 'false');
            }
        }

        pw2.addEventListener('input', checkConfirm);
        pw.addEventListener('input', checkConfirm);
    </script>
</body>
</html>
