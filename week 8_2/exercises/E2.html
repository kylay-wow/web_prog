<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Challenge 2</title>
</head>
<body>
    <form id="pw-confirm" novalidate>
        <div class="field-group">
            <label for="pw">Password</label>
            <input type="password" id="pw" minlength="8" required 
            aria-describedby="pw-err" aria-invalid="false"/>

            <span id="pw-err" role="alert" aria-live="polite"></span>
        </div>

        <div class="field-group">
            <label for="cfm">Confirm Password</label>
            <input type="password" id="cfm" required 
            aria-describedby="cfm-err" aria-invalid="false"/>

            <span id="cfm-err" role="alert" aria-live="polite"></span>
        </div>
        <button type="submit">Register</button>
    </form>

    <script>
        const pw = document.getElementById('pw');
        const err = document.getElementById('pw-err')
        const pw2 = document.getElementById('cfm');
        const err2 = document.getElementById('cfm-err');

        function validatePw(input){
            if (pw.validity.tooShort){
                err.textContent='Password too short'
            }else{
                pw.style.borderColor = 'green';
            }
            if (pw2.value === ''){
                pw2.setCustomValidity('');
                err2.textContent='';
                pw2.style.borderColor = 'red';
                pw2.setAttribute('aria-invalid', 'false');
            }else if (pw2.value !== pw.value){
                pw2.setCustomValidity('Password does not match');
                err2.textContent ='Password does not match';
                pw2.style.borderColor = 'red';
                pw2.setAttribute('aria-invalid', 'true');
            }else {
                pw2.setCustomValidity('');
                err2.textContent='Passwords match!';
                pw2.style.borderColor = 'green';
                pw2.setAttribute('aria-invalid', 'false');
            }
        }

        pw2.addEventListener('input', validatePw);
        pw.addEventListener('input', validatePw);

    </script>
</body>
</html>
