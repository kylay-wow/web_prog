<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Figures</title></head>
<body>
  <!-- Figure 1: image with figcaption -->
  <figure>
    <img src="https://picsum.photos/400/250?random=10"
    alt="randomly generated photo"> 
    <figcaption>Figure 1: A randomly generated photo</figcaption>
  </figure>

  <!-- Sentence with time element -->
  <p>Time: <time datetime="2026-09-11">September 11, 2026</time></p>

  <!-- Figure 2: pre+code block with figcaption -->
  <figure>
    <img src="Screenshot 2026-09-11 173536.png" alt="snippit of the code">
    <figcaption>Figure 2: snippet of the code</figcaption>
  </figure>
</body>
</html>
