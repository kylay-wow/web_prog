<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokemon stats</title>
    <style>
        * {
            box-sizing: border-box;
        }

        :root{
            --background: #f7f5f0;
            --primary: #355747;
            --main: #292e2b;
            --secondary: #777d78;
            --accent: #dce5dc;
            --surface: #FFFFFF;
        }


        body {
            margin: 0;
            padding: 40px 20px;
            font-family: Arial, sans-serif;
        }

        /* Headings */
        h1 {
            font-family: Georgia, serif;
            font-size: clamp(2rem, 5vw, 3.5rem);
        }

        /* API content cards */
        #poke-area{
            max-width: 650px;
            margin: 30px auto;
            padding: 32px;
            background-color: var(--surface);
            border-radius: 20px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.06);
        }

        /* Text styling */
        p {
            line-height: 1.6;
            overflow-wrap: anywhere;
        }

        #poke-name{
            font-size: 1.5rem;
            font-weight: bold;
        }

        /* Buttons */
        button {
            padding: 12px 20px;
            border: none;
            border-radius: 12px;
            background-color: var(--primary);
            color: white;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.2s ease;
        }

        button:hover {
            background-color: var(--accent);
            color: var(--main);
            transform: translateY(-2px);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        /* Error message */
        #error {
            padding: 12px;
            border-radius: 10px;
            background-color: #f9eae7;
            color: #9b3f35;
        }

        /* Loading spinner */
        #spinner {
            width: 30px;
            height: 30px;
            margin: 20px auto;
            border: 4px solid var(--accent);
            border-top: 4px solid var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            from {
                transform: rotate(0deg);
            }
            to {
                transform: rotate(360deg);
            }
        }

        /* Mobile layout */
        @media screen and (max-width: 600px) {
            body {
                padding: 24px 16px;
            }

            #poke-area{
                padding: 24px;
            }
        }
    </style>
</head>
<body>
    <h1>Pokemon statistics!</h1>
    <nav id="poke-area">
        <p id="poke-name"></p>
        <p id="poke-exp"></p>
        <button onclick="pokeStat()">Click for pokemon stats</button>
        <div id="spinner" style="display: none;"></div>
    </nav>
    <script>
        async function pokeStat(){
            const button = document.querySelector('button');
            const originalHTML = button.textContent;

            try{
                button.disabled = true;
                button.textContent = 'Loading...';
                document.getElementById('spinner').style.display = 'block';
                const res = await fetch(`https://pokeapi.co/api/v2/pokemon/pikachu`);
                if (!res.ok) throw new Error(`HTTP error: ${res.status}`);

                const data = await res.json();

                document.getElementById('poke-name').textContent = data.name;
                document.getElementById('poke-exp').textContent = data.base_experience;

            }catch (err) {
                document.getElementById('poke-name').textContent = 'Something went wrong!';
                document.getElementById('poke-exp').textContent = err.message;
            }finally{
                document.getElementById('spinner').style.display = 'none';
                button.disabled=false;
                button.textContent = originalHTML;
            }
        }
    </script>
</body>
</html>
